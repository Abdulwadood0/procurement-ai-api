[project]
name = "procurement-ai-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Wadoud", email = "abdwadood.kr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "colorlog>=6.12.0",
    "fastapi[standard]>=0.162.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "pymongo>=4.19.0",
]

[project.scripts]
procurement-ai-api = "procurement_ai_api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:langsmith.*:",
]

